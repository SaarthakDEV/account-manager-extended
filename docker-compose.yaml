services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-app
    ports:
      - "5800:5800"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      # Use DB_USERNAME, DB_PASSWORD or DB_NAME if it exits otherwise use postgres.
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/${DB_NAME:-postgres}?schema=public
      BASE_URL: "localhost:5800"
      USER_ID: "0b14cc2e-5098-4628-a8c5-4fdc91c20823"
    command: ./node_modules/.bin/next dev -p 5800 --webpack

  db:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  node_modules:
